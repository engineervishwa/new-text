    <path d="M70 144h460l-14 34H84z" fill="#f47c20"/>
    <path d="M110 144h40l-6 34h-40zM190 144h40l-4 34h-40zM270 144h40l-2 34h-40zM350 144h40v34h-40zM430 144h40l2 34h-40z" fill="#ffffff" opacity=".85"/>
  </g>
  <!-- counter window -->
  <rect x="100" y="200" width="250" height="150" rx="6" fill="#e8eefa" stroke="#9fb3d9" stroke-width="3"/>
  <rect x="125" y="230" width="90" height="60" rx="4" fill="#1b2333"/>
  <rect x="131" y="236" width="78" height="46" rx="2" fill="#4a7de0"/>
  <rect x="160" y="290" width="20" height="14" fill="#1b2333"/>
  <rect x="235" y="250" width="90" height="54" rx="4" fill="#ffffff" stroke="#9fb3d9" stroke-width="2"/>
  <rect x="245" y="262" width="70" height="6" rx="3" fill="#c9d3e6"/>
  <rect x="245" y="276" width="55" height="6" rx="3" fill="#c9d3e6"/>
  <rect x="245" y="290" width="62" height="6" rx="3" fill="#c9d3e6"/>
  <rect x="100" y="320" width="250" height="30" fill="#0b3d91" opacity=".9"/>
